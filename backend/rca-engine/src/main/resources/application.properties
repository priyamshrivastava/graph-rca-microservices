spring.config.import=classpath:application-common.properties
spring.application.name=rca-engine
server.port=${SERVER_PORT:8080}
spring.kafka.consumer.group-id=${TRACE_CONSUMER_GROUP:rca-engine}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.graphrca.common.dto.TraceEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.graphrca.common.dto
spring.kafka.listener.missing-topics-fatal=false
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rca}
spring.datasource.username=${DATABASE_USER:rca}
spring.datasource.password=${DATABASE_PASSWORD:rca-local-password}
spring.datasource.hikari.initialization-fail-timeout=60000
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
rca.services=${RCA_SERVICES:UserService,OrderService,PaymentService,InventoryService,NotificationService}
rca.baseline.window-size=${RCA_BASELINE_WINDOW_SIZE:120}
rca.baseline.ewma-alpha=${RCA_BASELINE_EWMA_ALPHA:0.2}
rca.baseline.minimum-samples=${RCA_BASELINE_MINIMUM_SAMPLES:5}
rca.metrics.rate-window-seconds=${RCA_RATE_WINDOW_SECONDS:10}
rca.thresholds.unhealthy-error-rate=${RCA_UNHEALTHY_ERROR_RATE:0.25}
rca.thresholds.unhealthy-z-score=${RCA_UNHEALTHY_Z_SCORE:3.0}
rca.services.freshness-seconds=${RCA_SERVICE_FRESHNESS_SECONDS:30}
rca.persistence.snapshot-interval-ms=${RCA_SNAPSHOT_INTERVAL_MS:10000}
rca.history.default-limit=${RCA_HISTORY_DEFAULT_LIMIT:50}
rca.history.max-limit=${RCA_HISTORY_MAX_LIMIT:500}
